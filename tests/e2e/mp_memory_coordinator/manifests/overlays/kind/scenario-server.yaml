# Stateful scenario server: fake MP Coordinator (9300), fake donor MP (8081
# + alt 8181), fake receiver MP (8082 + alt 8182), admin (9091).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-server
  labels:
    app.kubernetes.io/name: scenario-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scenario-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenario-server
    spec:
      containers:
        - name: scenario-server
          image: lmcache-memcoord-scenario:e2e
          imagePullPolicy: IfNotPresent
          env:
            # The fake coordinator advertises the Pod IP as the direct MP
            # address of both fake MP servers, never the worker IP.
            - name: SCENARIO_ADVERTISE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: coordinator
              containerPort: 9300
            - name: donor
              containerPort: 8081
            - name: donor-alt
              containerPort: 8181
            - name: receiver
              containerPort: 8082
            - name: receiver-alt
              containerPort: 8182
            - name: admin
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /__test/health
              port: admin
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-server
  labels:
    app.kubernetes.io/name: scenario-server
spec:
  selector:
    app.kubernetes.io/name: scenario-server
  ports:
    - name: coordinator
      port: 9300
      targetPort: coordinator
    - name: donor
      port: 8081
      targetPort: donor
    - name: donor-alt
      port: 8181
      targetPort: donor-alt
    - name: receiver
      port: 8082
      targetPort: receiver
    - name: receiver-alt
      port: 8182
      targetPort: receiver-alt
---
# Admin port on a distinct Service so it can be restricted to the E2E runner.
apiVersion: v1
kind: Service
metadata:
  name: scenario-server-admin
  labels:
    app.kubernetes.io/name: scenario-server
    lmcache.ai/e2e-admin: "true"
spec:
  selector:
    app.kubernetes.io/name: scenario-server
  ports:
    - name: admin
      port: 9091
      targetPort: admin
