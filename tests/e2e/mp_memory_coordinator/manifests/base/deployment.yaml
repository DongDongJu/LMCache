apiVersion: apps/v1
kind: Deployment
metadata:
  name: lmcache-mp-memory-coordinator
spec:
  # Exactly one writer. Recreate makes the old Pod terminate and release the
  # ReadWriteOncePod journal volume before the new Pod can mutate anything.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lmcache-mp-memory-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmcache-mp-memory-coordinator
    spec:
      serviceAccountName: lmcache-mp-memory-coordinator
      terminationGracePeriodSeconds: 60
      containers:
        - name: coordinator
          image: lmcache/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          command: ["lmcache", "mp-memory-coordinator"]
          args: ["--config", "/etc/lmcache/mp-memory-coordinator.yaml"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LMCACHE_TRACK_USAGE
              value: "false"
          ports:
            - name: http
              containerPort: 9400
          livenessProbe:
            # Preserve an intentionally inert corrupt-journal Pod for
            # diagnosis; readiness and /healthz still report the failure.
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/lmcache
              readOnly: true
            - name: journal
              mountPath: /var/lib/lmcache-memory-coordinator
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: lmcache-mp-memory-coordinator
        - name: journal
          persistentVolumeClaim:
            claimName: lmcache-mp-memory-coordinator-journal
