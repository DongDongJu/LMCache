# Pre-created Lease (coordination.k8s.io/v1). The coordinator only renews it
# with resourceVersion optimistic concurrency; it is coordination, not a
# downstream fencing token (safety = replicas 1 + Recreate + RWOP PVC).
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: lmcache-mp-memory-coordinator
spec:
  leaseDurationSeconds: 15
