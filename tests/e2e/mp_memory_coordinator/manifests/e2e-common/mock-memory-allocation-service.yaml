# Strict mock of the outside Memory Allocation service: public frozen API on
# 8080, test-only admin on 9090 (separate Service, runner-only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-memory-allocation-service
  labels:
    app.kubernetes.io/name: mock-memory-allocation-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-memory-allocation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-memory-allocation-service
    spec:
      containers:
        - name: mock
          image: lmcache-memory-allocation-mock:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: public
              containerPort: 8080
            - name: admin
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /__test/health
              port: admin
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  # The coordinator's memory_allocation_url resolves this name only.
  name: mock-memory-allocation-service
  labels:
    app.kubernetes.io/name: mock-memory-allocation-service
spec:
  selector:
    app.kubernetes.io/name: mock-memory-allocation-service
  ports:
    - name: public
      port: 8080
      targetPort: public
---
apiVersion: v1
kind: Service
metadata:
  name: mock-memory-allocation-service-admin
  labels:
    app.kubernetes.io/name: mock-memory-allocation-service
    lmcache.ai/e2e-admin: "true"
spec:
  selector:
    app.kubernetes.io/name: mock-memory-allocation-service
  ports:
    - name: admin
      port: 9090
      targetPort: admin
