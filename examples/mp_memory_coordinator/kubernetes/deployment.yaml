apiVersion: apps/v1
kind: Deployment
metadata:
  name: lmcache-mp-memory-coordinator
  labels:
    app.kubernetes.io/name: lmcache-mp-memory-coordinator
    app.kubernetes.io/part-of: lmcache
spec:
  # Do not scale above one: the outside allocation API has no fencing token.
  replicas: 1
  strategy:
    # Release the RWOP journal before the replacement Pod starts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lmcache-mp-memory-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmcache-mp-memory-coordinator
        app.kubernetes.io/part-of: lmcache
    spec:
      serviceAccountName: lmcache-mp-memory-coordinator
      # Allow an in-flight, bounded control cycle to persist its result before
      # the Pod is killed. Recreate then resumes from the durable journal.
      terminationGracePeriodSeconds: 300
      containers:
        - name: coordinator
          image: lmcache/standalone:REPLACE_WITH_RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["lmcache", "mp-memory-coordinator"]
          args: ["--config", "/etc/lmcache/mp-memory-coordinator.yaml"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LMCACHE_TRACK_USAGE
              value: "false"
          ports:
            - name: http
              containerPort: 9400
          livenessProbe:
            # A corrupt journal intentionally keeps the HTTP process alive and
            # unready for diagnosis. TCP liveness avoids restart-looping that
            # fail-closed state; /healthz still reports journal integrity.
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/lmcache
              readOnly: true
            - name: journal
              mountPath: /var/lib/lmcache-memory-coordinator
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: lmcache-mp-memory-coordinator-config
        - name: journal
          persistentVolumeClaim:
            claimName: lmcache-mp-memory-coordinator-journal
