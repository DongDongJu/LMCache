# The process only reads and renews its own pre-created Lease. It does not
# need access to Pods, Nodes, Device-DAX resources, or the journal PVC API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lmcache-mp-memory-coordinator-lease
  labels:
    app.kubernetes.io/name: lmcache-mp-memory-coordinator
    app.kubernetes.io/part-of: lmcache
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["lmcache-mp-memory-coordinator"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lmcache-mp-memory-coordinator-lease
  labels:
    app.kubernetes.io/name: lmcache-mp-memory-coordinator
    app.kubernetes.io/part-of: lmcache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lmcache-mp-memory-coordinator-lease
subjects:
  - kind: ServiceAccount
    name: lmcache-mp-memory-coordinator
