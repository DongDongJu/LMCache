# The Lease coordinates leadership. Singleton + Recreate + the RWOP journal
# volume remain the writer-safety boundary.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: lmcache-mp-memory-coordinator
  labels:
    app.kubernetes.io/name: lmcache-mp-memory-coordinator
    app.kubernetes.io/part-of: lmcache
spec:
  leaseDurationSeconds: 15
