[pytest]
log_cli = true
log_cli_level = INFO
markers =
    no_shared_allocator: Disable the shared-allocator monkeypatch for this test
    integration: Mark integration tests
    cuda: Tests that can only run with CUDA runtime
    xpu: Tests that can only run with XPU runtime
    musa: Tests that can only run with MUSA runtime
    sglang: Tests for SGLang connector/integration
    kind: MP Memory Coordinator E2E tests that also run against a deployed cluster (--kube-context)
    local_only: MP Memory Coordinator E2E tests that need local process control (skipped in cluster mode)
    hardware: MP Memory Coordinator real two-worker Device-DAX gate (manual; needs --dax-inventory-file)
    outside_api: frozen outside Memory Allocation API conformance against any implementation (needs --outside-api-url)

